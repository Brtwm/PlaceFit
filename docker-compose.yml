services:
  db:
    image: postgis/postgis:15-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-placefit}
      POSTGRES_USER: ${POSTGRES_USER:-placefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placefit}
    ports:
      - "5432:5432"
    volumes:
      - placefit_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-placefit}:${POSTGRES_PASSWORD:-placefit}@db:5432/${POSTGRES_DB:-placefit}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-placefit}:${POSTGRES_PASSWORD:-placefit}@db:5432/placefit_test
      ALLOW_DB_RESET_FOR_TESTS: "false"
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-fake}
      POI_PROVIDER: ${POI_PROVIDER:-fake}
      DGIS_API_KEY: ${DGIS_API_KEY:-}
      DGIS_BASE_URL: ${DGIS_BASE_URL:-https://catalog.api.2gis.com}
      DGIS_TIMEOUT_SECONDS: ${DGIS_TIMEOUT_SECONDS:-5.0}
      OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OSM_TIMEOUT_SECONDS: ${OSM_TIMEOUT_SECONDS:-10.0}
      EXTERNAL_USER_AGENT: ${EXTERNAL_USER_AGENT:-PlaceFit/0.1 (+https://github.com/Brtwm/PlaceFit)}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PLACEFIT_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    command: >
      streamlit run ui/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  placefit_postgres_data:
